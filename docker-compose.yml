services:
  db:
    image: postgres:15
    container_name: job_board_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  web:
    build: .
    container_name: job_board_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn job_board_platform.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    env_file:
      - .env

  celery:
    build: .
    container_name: job_board_celery
    command: >
      sh -c "sleep 10 &&
             celery -A job_board_platform worker -l info"
    volumes:
      - .:/app
    depends_on:
      # - db
      - redis
      - rabbitmq
    env_file:
      - .env

  celery_beat:
    build: .
    container_name: job_board_celery_beat
    command: >
      sh -c "sleep 15 &&
             celery -A job_board_platform beat -l info"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - rabbitmq
    env_file:
      - .env

volumes:
  postgres_data: